name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-24.04
            python: "3.9"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
  e2e:
    name: e2e (real Postgres + PostgREST)
    runs-on: ubuntu-24.04
    env:
      AUTHZPROBE_REQUIRE_E2E: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: PostgREST
        run: |
          curl -sSfL https://github.com/PostgREST/postgrest/releases/download/v13.0.4/postgrest-v13.0.4-linux-static-x86-64.tar.xz | tar xJ -C /usr/local/bin
          postgrest --version
          ls /usr/lib/postgresql/*/bin/initdb
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q tests/test_e2e_postgrest.py -rs
  action:
    name: GitHub Action against the example app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: start the example app (Postgres + PostgREST + Supabase-style gateway)
        run: |
          curl -sSfL https://github.com/PostgREST/postgrest/releases/download/v13.0.4/postgrest-v13.0.4-linux-static-x86-64.tar.xz | tar xJ -C /usr/local/bin
          nohup python scripts/localstack.py up --port 54321 --env-file /tmp/ap.env > /tmp/stack.log 2>&1 &
          for i in $(seq 60); do grep -q ready /tmp/stack.log && break; sleep 1; done
          cat /tmp/ap.env >> "$GITHUB_ENV"
      - name: the vulnerable app must fail the check
        id: vuln
        continue-on-error: true
        uses: ./
        with:
          url: ${{ env.SUPABASE_URL }}
          anon-key: ${{ env.SUPABASE_ANON_KEY }}
          service-key: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          public: posts
      - run: test "${{ steps.vuln.outcome }}" = failure
      - name: apply the suggested fixes
        run: |
          psql -h 127.0.0.1 -p "$PG_PORT" -U postgres -v ON_ERROR_STOP=1 -f examples/vibeapp/fixed.sql
          psql -h 127.0.0.1 -p "$PG_PORT" -U postgres -c "notify pgrst, 'reload schema'"
          sleep 2
      - name: the fixed app passes
        uses: ./
        with:
          url: ${{ env.SUPABASE_URL }}
          anon-key: ${{ env.SUPABASE_ANON_KEY }}
          service-key: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          public: posts
          args: --no-storage
